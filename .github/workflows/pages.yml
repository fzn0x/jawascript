name: Pages

# Builds the documentation website from docs/ and site/, and publishes it to
# GitHub Pages on every push to main. Pull requests build it without
# publishing, so a broken page shows up before it merges.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "assets/**"
      - "scripts/build_site.py"
      - "scripts/readme_image.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "assets/**"
      - "scripts/build_site.py"
      - "scripts/readme_image.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install markdown
        run: python -m pip install markdown==3.10.2
      - name: Build
        run: python scripts/build_site.py --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
